name: Remove Student AI Code
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove unused AI code
        run: python scripts/remove_student_ai.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/remove_student_ai.py .github/workflows/remove-student-ai.yml
          git add index.html scripts/remove_student_ai.py .github/workflows/remove-student-ai.yml
          git commit -m "Remove unused student AI feedback code"
          git push
