name: Improve Submission History

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-history-viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update historical submission learning page
        run: python .github/scripts/update_history_learning_page.py
