name: Fix pending learning page

on:
  push:
    paths:
      - '.github/workflows/fix-pending-learning-page.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch pending learning page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  if(!reviewed){
    $("submissionModalBody").innerHTML = `
      <div class="learning-subtitle">
        ${topicLabel} — Exercise ${escapeHTML(String(record.exercise_number))}
        &nbsp;•&nbsp; Attempt ${escapeHTML(String(record.attempt_number || ""))}
        &nbsp;•&nbsp; ${formatDate(record.completed_at)}
      </div>
      <div class="learning-section">
        <h3>📨 Workbook Successfully Submitted</h3>
        <p>Your work has been submitted successfully.</p>
        <p><strong>Wait for your teacher to review your work.</strong></p>
        <p>Your seven-part Student Writing Learning Page will appear after your teacher completes the review.</p>
      </div>
      <div class="learning-section">
        <h3>1️⃣ Original Sentence</h3>
        <div class="annotated-sentence">${escapeHTML(record.original_sentence || "")}</div>
      </div>
    `;
  }
'''
          new = '''  if(!reviewed){
    const aiWords = (exercise && exercise.vocab) || "Academic vocabulary will be generated for this topic.";
    const blank = `<div class="pending-placeholder">Your teacher will add coaching here.</div>`;
    $("submissionModalBody").innerHTML = `
      <div class="learning-subtitle">
        ${topicLabel} — Exercise ${escapeHTML(String(record.exercise_number))}
        &nbsp;•&nbsp; Attempt ${escapeHTML(String(record.attempt_number || ""))}
        &nbsp;•&nbsp; ${formatDate(record.completed_at)}
      </div>
      <div class="learning-section">
        <h3>📨 Workbook Successfully Submitted</h3>
        <p>Your work has been submitted successfully.</p>
        <p><strong>Wait for your teacher to review your work.</strong></p>
      </div>
      <div class="learning-section">
        <h3>1️⃣ Original Sentence</h3>
        <div class="annotated-sentence">${escapeHTML(record.original_sentence || "")}</div>
      </div>
      <div class="learning-section"><h3>2️⃣ What Needs Attention?</h3>${blank}</div>
      <div class="learning-section"><h3>3️⃣ Learn Why</h3>${blank}</div>
      <div class="learning-section"><h3>4️⃣ Correct Sentence</h3>${blank}</div>
      <div class="learning-section">
        <h3>5️⃣ Academic Words to Learn</h3>
        <div class="submission-modal-text">${escapeHTML(aiWords)}</div>
      </div>
      <div class="learning-section"><h3>6️⃣ Learn From a Strong Topic Sentence</h3>${blank}</div>
      <div class="learning-section"><h3>7️⃣ Your Next Step</h3>${blank}</div>
    `;
  }
'''
          if old not in s:
              raise SystemExit('Expected pending-page block was not found; no change made.')
          s = s.replace(old, new, 1)
          marker = '/* pending-learning-page-v2 */'
          css = '''\n/* pending-learning-page-v2 */\n.pending-placeholder{min-height:48px;padding:12px;border:1px dashed #cbd8ee;border-radius:10px;background:#fff;color:#94a3b8;font-style:italic;line-height:1.6}\n'''
          if marker not in s:
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show all pending learning page sections'
          git push
