name: Apply Teacher Submit Patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch workbook
        run: python scripts/teacher_submit_patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/teacher_submit_patch.py .github/workflows/apply-teacher-submit-patch.yml
          git add index.html scripts/teacher_submit_patch.py .github/workflows/apply-teacher-submit-patch.yml
          git commit -m "Make student work teacher-reviewed"
          git push
