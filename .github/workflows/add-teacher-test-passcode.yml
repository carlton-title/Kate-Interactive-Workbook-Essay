name: Add teacher test mode passcode

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Teacher Test Mode
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'function startTestMode\(\)\{.*?\n\}\n\n\nfunction enterWorkbook\(\)\{'
          replacement = '''async function startTestMode(){

  const passcode = prompt("Teacher Test Mode passcode:");

  if(passcode === null)
    return;

  const bytes = new TextEncoder().encode(passcode);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  const hash = Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");

  if(hash !== "41ec532df8a4fab502d09f45a3933b021d807b9a5b04663ae01ca52a1975e90a"){
    $("loginError").textContent =
      "Incorrect Teacher Test Mode passcode.";
    return;
  }

  $("loginError").textContent = "";

  teacherTestMode = true;

  currentStudentID = "TEST";

  currentStudentName =
    "Teacher Test Account";

  currentStudentNumber =
    "TEST";

  enterWorkbook();

}


function enterWorkbook(){'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate startTestMode block; no change made.')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add passcode to Teacher Test Mode'
          git push
