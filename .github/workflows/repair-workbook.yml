name: Repair workbook

on:
  push:
    branches:
      - fix/workbook-live-submit

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[workbook-fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/workbook-live-submit
          fetch-depth: 0

      - name: Repair workbook
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''    👨‍🏫 Your teacher is reading\n    your sentence...'''
          if old not in s:
              raise SystemExit('Old analyzing message not found')
          s = s.replace(old, '    Submitting...', 1)

          old_invoke = '''  const {\n    data,\n    error\n  } =\n    await supabaseClient\n      .functions\n      .invoke(\n        "essay-ai-tutor",\n        {\n          body:{\n            studentId:\n              currentStudentID,\n\n            topic:\n              topic,\n\n            prompt:\n              exercise.prompt,\n\n            strategy:\n              $("strategy").value,\n\n            sentence:\n              clean,\n\n            previousPerformance:\n              previousPerformance\n          }\n        }\n      );'''

          new_invoke = '''  const invokePromise =\n    supabaseClient\n      .functions\n      .invoke(\n        "essay-ai-tutor",\n        {\n          body:{\n            studentId:\n              currentStudentID,\n\n            topic:\n              topic,\n\n            prompt:\n              exercise.prompt,\n\n            strategy:\n              $("strategy").value,\n\n            sentence:\n              clean,\n\n            previousPerformance:\n              previousPerformance\n          }\n        }\n      );\n\n  const timeoutPromise =\n    new Promise((_, reject) => {\n      setTimeout(\n        () =>\n          reject(\n            new Error(\n              "The AI tutor took too long to respond. Please try again."\n            )\n          ),\n        30000\n      );\n    });\n\n  const {\n    data,\n    error\n  } =\n    await Promise.race([\n      invokePromise,\n      timeoutPromise\n    ]);'''

          if old_invoke not in s:
              raise SystemExit('AI invoke block not found')
          s = s.replace(old_invoke, new_invoke, 1)

          start = s.index('$("check").addEventListener(')
          end = s.index('\n\n\n/* =========================================================\n   NEXT', start)

          handler = '''$("check").addEventListener(\n  "click",\n  async () => {\n\n    const text =\n      $("answer")\n        .value\n        .trim();\n\n\n    if(!text){\n\n      alert(\n        "Write one topic sentence first."\n      );\n\n      return;\n\n    }\n\n\n    $("check").disabled = true;\n\n    $("analyzing")\n      .classList\n      .add("show");\n\n\n    $("feedback")\n      .classList\n      .remove("show");\n\n\n    $("saveStatus").textContent = "";\n\n\n    try {\n\n      await new Promise(\n        resolve =>\n          setTimeout(resolve, 700)\n      );\n\n\n      await updateSpelling(text);\n\n\n      const result =\n        await analyze(text);\n\n\n      showLearningPage(\n        text,\n        result\n      );\n\n\n      const attempts =\n        records.filter(\n          r =>\n            r.topic === topic &&\n            r.exercise_number ===\n              exerciseIndex + 1\n        ).length;\n\n\n      await saveSubmission(\n        text,\n        result,\n        attempts + 1\n      );\n\n\n      await loadRecords();\n\n\n      $("next").disabled = false;\n\n\n      $("feedback")\n        .scrollIntoView({\n          behavior:"smooth"\n        });\n\n\n    }\n    catch(error){\n\n      console.error(\n        "Analysis failed:",\n        error\n      );\n\n\n      $("saveStatus").textContent =\n        "⚠️ " +\n        (\n          error.message ||\n          "The writing feedback could not be generated."\n        );\n\n\n      $("saveStatus")\n        .className =\n        "save-status save-error";\n\n\n    }\n    finally{\n\n      $("analyzing")\n        .classList\n        .remove("show");\n\n\n      $("check").disabled = false;\n\n    }\n\n  }\n);'''

          s = s[:start] + handler + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'Your teacher is reading' index.html && exit 1 || true
          grep -q 'Submitting...' index.html
          grep -q 'finally{' index.html
          grep -q '30000' index.html

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/repair-workbook.yml
          git commit -m "Fix workbook submission handling [workbook-fix]"
          git push origin fix/workbook-live-submit
