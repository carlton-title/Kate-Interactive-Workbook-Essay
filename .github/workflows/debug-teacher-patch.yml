name: Debug Teacher Patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  debug:
    if: ${{ !startsWith(github.event.head_commit.message, 'DEBUG') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          anchors = [
            '/* =========================================================\n   ANALYZE BUTTON\n========================================================= */',
            '/* =========================================================\n   TOPIC BUTTONS',
            'async function saveSubmission(',
            '/* =========================================================\n   RECORD FEEDBACK',
            'function showLearningPage(',
            '/* =========================================================\n   SAVE TO SUPABASE',
            'function generateRecordFeedback(',
            '/* =========================================================\n   LOAD RECORDS',
            'function openSubmission(record){',
            'function closeSubmission(){',
            'function renderRecords(){'
          ]
          lines = [f'index_size={len(s)}']
          for a in anchors:
              lines.append(f'{a.splitlines()[0][:30]} => {a in s}')
          Path('debug_teacher_patch.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug_teacher_patch.txt
          git commit -m "DEBUG teacher patch anchors"
          git push
