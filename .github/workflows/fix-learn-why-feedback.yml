name: Improve Learn Why feedback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update Learn Why feedback logic
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''  } else {\n\n    explanation += `\n      <p>\n        Your sentence is developing well.\n        Now focus on making your vocabulary precise\n        and your main idea clear.\n      </p>\n    `;\n\n  }'''

          new = '''  } else {\n\n    const score = Number(result.score) || 0;\n    const issueTypes = result.issues.map(i => i.type);\n    const hasGrammar =\n      issueTypes.includes("grammar") ||\n      issueTypes.includes("agreement");\n    const hasSpelling =\n      issueTypes.includes("spelling");\n    const hasPunctuation =\n      issueTypes.includes("punctuation") ||\n      issueTypes.includes("capitalization");\n    const hasVocabulary =\n      issueTypes.includes("word");\n\n    let lesson = "";\n\n    if(score <= 3){\n      lesson = `\n        <p>\n          Your sentence needs major revision. First make sure it directly answers the writing task, then correct the marked errors and state one clear main idea.\n        </p>\n      `;\n    }\n    else if(score <= 5){\n      lesson = `\n        <p>\n          Your sentence has a beginning idea, but it needs clearer grammar and a stronger connection to the writing task. Rewrite it as one complete topic sentence with one clear main idea.\n        </p>\n      `;\n    }\n    else if(score <= 7){\n      lesson = `\n        <p>\n          Your sentence communicates part of the idea, but it still needs revision before it is a strong topic sentence. Make the main idea more specific and use precise academic vocabulary.\n        </p>\n      `;\n    }\n    else {\n      lesson = `\n        <p>\n          Your sentence is generally strong. To improve it further, make the main idea more specific and choose precise academic vocabulary.\n        </p>\n      `;\n    }\n\n    const focus = [];\n    if(hasGrammar) focus.push("grammar and sentence structure");\n    if(hasSpelling) focus.push("spelling");\n    if(hasPunctuation) focus.push("capitalization and punctuation");\n    if(hasVocabulary) focus.push("word choice");\n\n    if(focus.length){\n      lesson += `\n        <p>\n          <strong>Your learning focus:</strong> Work first on ${focus.join(", ")}. Then compare your original sentence with the corrected sentence below.\n        </p>\n      `;\n    } else {\n      lesson += `\n        <p>\n          <strong>Your learning focus:</strong> Compare your original sentence with the corrected sentence below and check that your topic and main idea are both clear.\n        </p>\n      `;\n    }\n\n    explanation += lesson;\n\n  }'''

          if old not in s:
              raise SystemExit('Expected Learn Why block not found; no changes made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit the change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-learn-why-feedback.yml
          git add index.html .github/workflows/fix-learn-why-feedback.yml
          git commit -m "Improve student Learn Why feedback" || exit 0
          git push
