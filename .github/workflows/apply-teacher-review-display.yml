name: Apply Teacher Review Display
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch display
        run: python scripts/teacher_review_display_patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/teacher_review_display_patch.py .github/workflows/apply-teacher-review-display.yml
          git add index.html scripts/teacher_review_display_patch.py .github/workflows/apply-teacher-review-display.yml
          git commit -m "Show teacher-authored seven-part feedback"
          git push
