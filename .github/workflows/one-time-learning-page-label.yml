name: Label Student Writing Learning Page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rename learning page heading
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '📖 Your Writing Learning Page'
          new = '📖 Student Writing Learning Page'
          if new not in s:
              if old not in s:
                  raise SystemExit('Learning page heading not found; no changes made.')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          workflow = Path('.github/workflows/one-time-learning-page-label.yml')
          workflow.unlink(missing_ok=True)

      - name: Commit the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-learning-page-label.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Label learning section as Student Writing Learning Page"
            git push
          fi
